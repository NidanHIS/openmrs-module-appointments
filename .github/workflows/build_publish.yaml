name: Build and Publish package
on:
  push:
    branches: [ master ]

jobs:
  build-publish-package:
    name: Build and Publish package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Build with Maven
        # Disabled Maven deploy for Nidan fork — Bahmni Nexus secrets are upstream-only.
        # Use `mvn package` to build the OMOD locally; deploy manually to Nidan artifact store.
        run: |
          PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$PROJECT_VERSION" == *"-SNAPSHOT" ]]; then
            ./mvnw --no-transfer-progress clean -U package
          else
            echo "❌ The current push is for release. So skipping build."
          fi
