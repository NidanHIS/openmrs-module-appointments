name: Build and Release package
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  
jobs:
  build-release-package:
    # Disabled for Nidan fork — Bahmni Nexus/GPG secrets are upstream-only.
    # Re-enable and wire to Nidan artifact store when a release pipeline is set up.
    if: false
    name: Build and Release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Compare Git tag with Maven version
        run: |
          export GIT_TAG=${GITHUB_REF#refs/tags/}
          PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ "$PROJECT_VERSION" != "$GIT_TAG" ]; then
            echo "❌ The Git tag ($GIT_TAG) does not match the Maven version ($PROJECT_VERSION)."
            exit 1
          else
            echo "✅ The Git tag matches the Maven version."
          fi

      - name: Build with Maven (no deploy)
        run: ./mvnw --no-transfer-progress clean -U package